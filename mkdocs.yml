site_name: Data science
site_author: Digital Education Service
copyright: Copyright © Digital Education Service | University of Leeds

nav:
    - Welcome: index.md
    - Unit 1:
        - '1. What is data science?': content/unit1/01_01_what-is-data-science.md
        - '2. The data, its quality and its structure': content/unit1/01_02_the_data_its_quality_and_its_structure.md
        - '3. Data preparation': content/unit1/01_03_data_preparation.md
        - '4. Data visualisation': content/unit1/01_04_data_visualisation.md
        - '5. Unit summary': content/unit1/01_05_unit_summary.md
        - '6. Unit references': content/unit1/01_06_unit_references.md
    - Unit 2:
        - 'Classification': content/unit2/02_00_classification.md
        - '1. Decision trees': content/unit2/02_01_decision_trees.md
        - '2. Decision tree training': content/unit2/02_02_DT_training.md
        - '3. DT training on a vertebrate dataset': content/unit2/02_03_DT_vertebrate.md
        - '4. Measuring the performance of a classification model': content/unit2/02_04_measuring_performance.md
        - '5. Overfitting, underfitting and generalisation': content/unit2/02_05_overfitting_underfitting.md
        - '6. References': content/unit2/02_06_unit_references.md

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
  font:
    text: Inter
  favicon: img/favicon.jpg

plugins:
  - search

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.betterem:
      smart_enable: all


extra_javascript:
  - javascript/tablecontentsoverride.js
  - javascript/config.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - css/extra.css
